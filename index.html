<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCNA Exam Simulator</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>KCNA Exam Simulator</h1>
            <div id="timer">Time: 00:00:00</div>
        </header>

        <div id="welcome-screen">
            <h2>Welcome to the KCNA Exam Simulator</h2>
            <p>This simulator contains two sets of questions from the Kubernetes and Cloud Native Associate exam.</p>
            <div class="exam-selection">
                <button id="set1-btn" class="btn" disabled>Question Set 1 (60 Questions)</button>
                <button id="set2-btn" class="btn" disabled>Question Set 2 (60 Questions)</button>
            </div>
            <div class="option-toggle">
                <label for="practice-mode-toggle">
                    <input type="checkbox" id="practice-mode-toggle">
                    Practice mode: show correct/incorrect answer right after each question
                </label>
            </div>
            <div id="status-message" style="margin-top: 20px; color: #e74c3c;"></div>
        </div>

        <div id="exam-screen" class="hidden">
            <div id="progress-bar">
                <div id="progress"></div>
            </div>
            <div id="question-info">
                <span id="question-number">Question 1 of 60</span>
                <span id="question-nav">
                    <button id="prev-btn" class="nav-btn" disabled>Previous</button>
                    <button id="next-btn" class="nav-btn">Next</button>
                </span>
            </div>
            <div id="question-container">
                <h2 id="question-text"></h2>
                <div id="options-container"></div>
                <div id="answer-feedback" class="hidden"></div>
            </div>
            <div id="question-list"></div>
            <div id="bottom-actions">
                <button id="next-btn-bottom" class="btn">Next</button>
                <button id="submit-exam" class="btn btn-muted">Submit Exam</button>
            </div>
        </div>

        <div id="results-screen" class="hidden">
            <h2>Exam Results</h2>
            <div id="score-summary">
                <div id="score"></div>
                <div id="pass-fail"></div>
            </div>
            <div id="review-container">
                <h3>Review Questions</h3>
                <div id="review-questions"></div>
            </div>
            <button id="restart-btn" class="btn">Take Another Exam</button>
        </div>
    </div>

    <!-- Question data is loaded via plain <script> tags (not fetch/XHR of JSON),
         so the app works by simply double-clicking index.html — no local
         server required and no file:// CORS errors. See README for details. -->
    <script src="data/questionSet1.js"></script>
    <script src="data/questionSet2.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
